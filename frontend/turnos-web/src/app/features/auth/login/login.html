<main class="pagina-login">
  <h1>Iniciar sesión</h1>

  <form [formGroup]="form" (ngSubmit)="iniciarSesion()">
    <div class="campo">
      <label for="nombreUsuario">Usuario</label>
      <input
        id="nombreUsuario"
        type="text"
        formControlName="nombreUsuario"
        autocomplete="username"
      />
      @if (form.controls.nombreUsuario.touched && form.controls.nombreUsuario.invalid) {
        <p class="error-campo">Ingresa el usuario.</p>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p class="error-campo">Ingresa la contraseña.</p>
      }
    </div>

    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    @if (errorLogin()) {
      <p class="error-api">{{ errorLogin() }}</p>
    }
  </form>
</main>
